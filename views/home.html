<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorhythm</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
</head>
<body class="home-page">
    <div class="ambient-orb orb-one" aria-hidden="true"></div>
    <div class="ambient-orb orb-two" aria-hidden="true"></div>
    <header>
        <nav class="tabs fade-in">
            <a href="/" class="tab-link">Home</a>
            <a href="/top-artists" class="tab-link">Top Artists</a>
            <a href="/top-tracks" class="tab-link">Top Tracks</a>
        </nav>
    </header>
    <main class="home-main fade-in">
        <section class="home-hero">
            <h1 class="home-title">Hey {{.UserName}}, your listening story is ready!</h1>
        </section>

        <section class="snapshot-grid" aria-label="Listening snapshot">
            <article class="snapshot-card">
                <h2>Top Genre</h2>
                <p class="snapshot-value">{{.TopGenre}}</p>
            </article>
        </section>

        <section class="trend-panel" aria-label="Listening trends">
            <h2>Trending This Month</h2>
            <div class="trend-stats">
                <div class="trend-stat">
                    <span class="trend-label">Listening Sessions</span>
                    <span class="trend-number">{{.ListeningSessions}}</span>
                </div>
                <div class="trend-stat">
                    <span class="trend-label">Unique Artists</span>
                    <span class="trend-number">{{.UniqueArtists}}</span>
                </div>
                <div class="trend-stat">
                    <span class="trend-label">Fresh Discoveries</span>
                    <span class="trend-number">{{.FreshDiscoveries}}</span>
                </div>
            </div>
        </section>
    </main>
    {{template "footer" .}}
</body>
</html>
